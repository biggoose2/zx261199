<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>果冻蛙瓶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
/* 横屏 3D 游戏：全屏 WebGL 舞台；UI 为暖白毛玻璃浮层（左上品牌、右上数据、底部工具坞、右侧罐子操作），单一暖光主题 */
:root{
  --bg:#eadccd;--ink:#4a3c45;--ink-soft:rgba(74,60,69,.58);--glass:rgba(255,252,248,.62);--line:rgba(255,255,255,.9);
  --accent:#ff7d93;--accent-2:#ffb36b;--mint:#4fcf9f;--shadow:0 10px 30px rgba(110,70,60,.16);
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--latin:"Fredoka","Noto Sans SC",sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl,#fxc{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fxc{pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 9px;border-radius:999px}
.logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ffc2cf 30%,#ff7d93 75%);box-shadow:inset 0 -3px 6px rgba(200,40,80,.25),0 3px 8px rgba(255,125,147,.4);position:relative}
.logo::before,.logo::after{content:"";position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2a1b28 0 32%,#fff 36% 48%,#ff9fb2 52%);}
.logo::before{left:3px}.logo::after{right:3px}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.1em;line-height:1.1}
.brand i{display:block;font-style:normal;font-family:var(--latin);font-size:10px;letter-spacing:.3em;color:var(--ink-soft)}
.stats{display:flex;gap:8px;pointer-events:auto}
.stat{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 8px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);font-family:var(--font);color:var(--ink)}
.stat span{font-family:var(--latin);font-size:15px;font-variant-numeric:tabular-nums}
.stat em{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.stat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dock-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:14px;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.spawn{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;color:#fff;font:900 13px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 35% 28%,#ffd4dc 0 10%,#ff98aa 35%,#ff6f88 80%);box-shadow:0 10px 24px rgba(255,111,136,.45),inset 0 -6px 12px rgba(190,40,80,.3),inset 0 4px 8px rgba(255,255,255,.5);transition:transform .12s}
.spawn svg{width:26px;height:26px}
.spawn:active{transform:scale(.92)}
.dock{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:26px}
.tool{width:64px;height:58px;border:0;border-radius:20px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px var(--font);cursor:pointer;transition:background .15s,transform .12s,color .15s}
.tool svg{width:26px;height:26px}
.tool:active{transform:scale(.92)}
.tool[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 4px 12px rgba(110,70,60,.15)}
.tool:focus-visible,.spawn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seal{position:fixed;transform:translate(-50%,-100%);border:0;border-radius:999px;padding:10px 18px;font:900 14px var(--font);color:#fff;cursor:pointer;white-space:nowrap;
  background:linear-gradient(180deg,#d9a46a,#b98149);box-shadow:0 8px 18px rgba(140,90,40,.35),inset 0 2px 0 rgba(255,255,255,.35);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-100% - 5px))}}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);padding:11px 22px;border-radius:999px;font-weight:900;font-size:16px;pointer-events:none;white-space:nowrap;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.toast small{font-weight:700;font-size:12px;margin-right:8px;padding:2px 8px;border-radius:999px;color:#fff;vertical-align:2px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);padding:8px 16px;border-radius:14px;font-size:12.5px;line-height:1.7;text-align:center;pointer-events:none;transition:opacity 1s;max-width:calc(100% - 40px);width:max-content}
.hint.fade{opacity:0}
.rot{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:12px;pointer-events:none;display:none}
@media (orientation:portrait){.rot{display:block}.tool{width:52px}.spawn{width:64px;height:64px}}
.sheet{position:fixed;inset:0;background:rgba(60,40,50,.28);display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:#fffaf6;border-radius:26px;box-shadow:0 24px 60px rgba(60,30,40,.25);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop2 .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop2{from{transform:scale(.85);opacity:0}}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.card-h h2{margin:0;font-size:19px;font-weight:900;letter-spacing:.08em}
.card-h p{margin:2px 0 0;font-size:12px;color:var(--ink-soft)}
.x{border:0;background:#f2e8e2;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.card-b{overflow-y:auto;padding:4px 20px 20px;touch-action:pan-y}
.tier{margin:12px 0 8px;font-size:12px;font-weight:900;letter-spacing:.15em;display:flex;align-items:center;gap:8px}
.tier::after{content:"";flex:1;height:1px;background:rgba(74,60,69,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.dx{border-radius:18px;background:#fff;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(74,60,69,.06);border:1px solid rgba(74,60,69,.06)}
.dx .ball{width:46px;height:40px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;position:relative;box-shadow:inset 0 -6px 10px rgba(0,0,0,.12),inset 0 5px 8px rgba(255,255,255,.6)}
.dx .ball::before{content:"";position:absolute;left:8px;top:6px;width:12px;height:7px;border-radius:50%;background:rgba(255,255,255,.75)}
.dx b{font-size:12.5px}
.dx.lock{opacity:.55}.dx.lock .ball{background:#e7ded8!important;box-shadow:inset 0 -4px 8px rgba(0,0,0,.08)}
.dx.lock b{color:var(--ink-soft)}
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.jar{border-radius:20px;background:linear-gradient(180deg,#fff,#f6fbf9);border:1px solid rgba(120,180,160,.25);padding:12px;display:flex;flex-direction:column;gap:8px}
.jar .dots{display:flex;flex-wrap:wrap;gap:5px}
.jar .dots i{width:18px;height:16px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;display:inline-block;box-shadow:inset 0 -3px 5px rgba(0,0,0,.12)}
.jar small{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.jar b{font-size:13px}
.empty{padding:30px 0;text-align:center;color:var(--ink-soft);font-size:13px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:14px}
@media (prefers-reduced-motion:reduce){.toast,.card,.seal{animation:none}}
</style>
</head>
<body>


<canvas id="gl"></canvas><canvas id="fxc"></canvas>
<header class="top">
  <div class="brand glass"><div class="logo"></div><div><b>果冻蛙瓶</b><i>JELLY FROG</i></div></div>
  <div class="stats">
    <div class="stat glass" style="cursor:default"><em style="background:#ff8fa3">蛙</em>桌上 <span id="sCnt">0</span></div>
    <button class="stat glass" id="openDex" type="button"><em style="background:#8b7bff">鉴</em>图鉴 <span id="sDex">0/0</span></button>
    <button class="stat glass" id="openCab" type="button"><em style="background:#4fcf9f">瓶</em>展柜 <span id="sCol">0</span></button>
  </div>
</header>
<div class="hint glass" id="hint">拖动甩飞 · 双指拉长到爆开 · 同款同大小挤在一起会合成<br>把蛙塞进右边的玻璃罐，点「封瓶收藏」放进展柜 · 歪手机，蛙会跟着滚</div>
<div class="rot glass">横过来玩更舒服</div>
<div class="toast glass" id="toast" hidden></div>
<button class="seal" id="seal" type="button" hidden>封瓶收藏</button>
<div class="dock-wrap">
  <button class="spawn" id="spawn" type="button" aria-label="来只蛙"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>来只蛙</button>
  <nav class="dock glass">
    <button class="tool" data-tool="hand" aria-pressed="true" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4a1.5 1.5 0 0 1 3 0v6m0-4.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.2 15a1.6 1.6 0 0 1 2.4-2.1L8 14.5"/></svg>拖拽</button>
    <button class="tool" data-tool="bomb" aria-pressed="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="14" r="6.5"/><path d="M15 9.5l2-2M17.5 4.5l.5-1.5M20 7l1.5-.5"/></svg>炸弹</button>
    <button class="tool" data-tool="hammer" aria-pressed="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="12" height="7" rx="3" transform="rotate(-30 9 7.5)"/><path d="M11.5 10.5L19 21"/></svg>小锤</button>
    <button class="tool" data-tool="freeze" aria-pressed="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 6l2.5-1.5M9.5 19.5L12 18l2.5 1.5"/></svg>冰冻</button>
  </nav>
</div>
<div class="sheet" id="dexSheet" hidden><div class="card" role="dialog" aria-labelledby="dexT"><div class="card-h"><div><h2 id="dexT">果冻蛙图鉴</h2><p>合成会随机出新款，越大越容易出稀有和传说</p></div><button class="x" type="button" data-close>×</button></div><div class="card-b" id="dexBody"></div></div></div>
<div class="sheet" id="cabSheet" hidden><div class="card" role="dialog" aria-labelledby="cabT"><div class="card-h"><div><h2 id="cabT">我的展柜</h2><p>封好的每一瓶都在这里</p></div><button class="x" type="button" data-close>×</button></div><div class="card-b" id="cabBody"></div></div></div>
<div id="err" hidden>这台设备的浏览器不支持 WebGL，无法显示 3D 效果。</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const canvas=$('gl');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}catch(e){$('err').hidden=false;throw e}
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#eadccd');
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),0.04).texture;scene.backgroundIntensity=1;
const camera=new THREE.PerspectiveCamera(30,1,0.1,200);

/* ---------- 程序纹理 ---------- */
const P=new Uint8Array(512);{const a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)P[i]=a[i&255]}
const GR=new Float32Array(256).map(()=>Math.random()*2-1);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),u=x-xi,v=y-yi,su=u*u*(3-2*u),sv=v*v*(3-2*v),X=xi&255,Y=yi&255;const a=GR[P[P[X]+Y]],b=GR[P[P[X+1]+Y]],c=GR[P[P[X]+Y+1]],d=GR[P[P[X+1]+Y+1]];return a+(b-a)*su+(c-a)*sv+(a-b-c+d)*su*sv}
function fbm(x,y,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2.03;a*=.5}return s}
function pixTex(w,h,fn,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),img=x.createImageData(w,h),d=img.data;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const o=(j*w+i)*4,[r,g,b]=fn(i,j);d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255}x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
function canTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const woodTex=pixTex(1024,512,(i,j)=>{const ring=j*.09+fbm(i*.003,j*.04,4)*4;const q=.5+.5*Math.sin(ring*6.283),m=q*q*q;const f=fbm(i*.03,j*.6,2)*7+fbm(i*.002,j*.01,2)*10;
  return[lerp(232,214,m)+f,lerp(204,182,m)+f*.85,lerp(166,140,m)+f*.6]});
const woodRough=pixTex(512,256,(i,j)=>{const v=150+fbm(i*.01,j*.2,3)*60;return[v,v,v]},false);
const plasterTex=pixTex(512,512,(i,j)=>{const n=fbm(i*.012,j*.012,4)*12+fbm(i*.08,j*.08,2)*5;return[242+n,233+n,222+n]});
const corkTex=pixTex(256,256,()=>{const v=Math.random();return v<.25?[150,105,62]:v<.6?[205,160,110]:[224,186,135]});
// 窗格 + 叶影投影（聚光灯 gobo）
const gobo=canTex(512,512,(x,w,h)=>{x.fillStyle='#000';x.fillRect(0,0,w,h);x.fillStyle='#fff2d8';x.fillRect(w*.12,h*.12,w*.76,h*.76);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(w*.49,h*.1,w*.02,h*.8);x.fillRect(w*.1,h*.49,w*.8,h*.02);
  const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;const t=tmp.getContext('2d');t.filter='blur(16px)';t.drawImage(x.canvas,0,0);x.clearRect(0,0,w,h);x.drawImage(tmp,0,0)});
const blobTex=canTex(128,128,(x,w)=>{const g=x.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);g.addColorStop(0,'rgba(60,35,25,.55)');g.addColorStop(.5,'rgba(60,35,25,.22)');g.addColorStop(1,'rgba(60,35,25,0)');x.fillStyle=g;x.fillRect(0,0,w,w)});
const causticTex=canTex(256,256,(x,w)=>{x.globalCompositeOperation='lighter';let g=x.createRadialGradient(w*.5,w*.5,0,w*.5,w*.5,w*.48);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.25,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,w);
  x.filter='blur(3px)';x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=3;for(let i=0;i<7;i++){x.beginPath();x.ellipse(w*.5+rand(-30,30),w*.5+rand(-20,20),rand(30,80),rand(14,40),rand(0,3),0,rand(2,5));x.stroke()}});
const sparkTex=canTex(64,64,(x,w)=>{const c=w/2;x.translate(c,c);const g=x.createRadialGradient(0,0,0,0,0,c);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.15,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(-c,-c,w,w);x.fillStyle='#fff';for(const a of [0,Math.PI/2]){x.save();x.rotate(a);x.beginPath();x.moveTo(-c,0);x.lineTo(0,-2.2);x.lineTo(c,0);x.lineTo(0,2.2);x.fill();x.restore()}});
const flareTex=canTex(128,128,(x,w)=>{const c=w/2;x.translate(c,c);x.globalCompositeOperation='lighter';let g=x.createRadialGradient(0,0,0,0,0,c*.35);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(-c,-c,w,w);
  for(const [a,l,wd] of [[0,c,3],[Math.PI/2,c,3],[Math.PI/4,c*.55,1.6],[-Math.PI/4,c*.55,1.6]]){x.save();x.rotate(a);g=x.createLinearGradient(-l,0,l,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.moveTo(-l,0);x.lineTo(0,-wd);x.lineTo(l,0);x.lineTo(0,wd);x.fill();x.restore()}});
const cheekTex=canTex(64,64,(x,w)=>{const g=x.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);g.addColorStop(0,'rgba(255,90,130,.75)');g.addColorStop(1,'rgba(255,90,130,0)');x.fillStyle=g;x.fillRect(0,0,w,w)});

/* ---------- 场景：墙 + 原木桌 + 装饰 ---------- */
const DESK_Z0=-2.6,DESK_Z1=1.6;
plasterTex.repeat.set(4,3);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(60,30),new THREE.MeshStandardMaterial({map:plasterTex,roughness:.95,envMapIntensity:.32}));wall.position.set(0,14.4,DESK_Z0);wall.receiveShadow=true;scene.add(wall);

    m.sq-=dt;if(m.sq<=0){m.sq=.13;sfx.squeak(m.t/m.dur);if(m.t>.5)buzz(4)}
    if(m.t>=m.dur)finishMerge(m,mx,my)}}
function endMerge(m){merges.splice(merges.indexOf(m),1);for(const f of [m.a,m.b])if(f.merge===m)f.merge=null;scene.remove(m.glow)}
function finishMerge(m,mx,my){const tier=m.a.tier+1,jin=m.a.jst==='in'||m.b.jst==='in';endMerge(m);killFrog(m.a);killFrog(m.b);
  const r=TIER_R[tier-1],{f,nw}=newFrog(m.res,tier,mx,Math.max(my,r*.9),.5);if(jin)f.jst='in';addVel(f,0,4,.2);f.expr='happy';f.exprT=1.2;
  flash(mx,my,.8,colorOf(m.res),r*5,.5);const col=new THREE.Color(colorOf(m.res));for(let i=0;i<24;i++){const a=rand(0,6.28),sp=rand(2.5,6);addPart({x:mx,y:my,z:rand(-.3,.5),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+1.5,vz:rand(-2,2),s:rand(.03,.06),life:.8,col:i%3?col:new THREE.Color('#ffffff'),kind:'spark'})}
  sfx.merge();buzz([12,30,18]);toast(`${m.res.name} · ${TIER_N[tier-1]}`,nw?'新发现':m.res.rare||'',nw?2000:1300)}

/* ---------- 封瓶收藏 ---------- */
let jarFly=null;
function sealAvail(){return !J.sealed&&J.lidT<=0&&!jarFly&&frogs.some(f=>f.inJar)&&!frogs.some(f=>f.jst==='in'&&!f.inJar)}
function seal(){if(!sealAvail())return;J.lidT=.001;sfx.squeak(.6)}
function collectJar(){const inside=frogs.filter(f=>f.jst==='in');const rec={t:Date.now(),frogs:inside.map(f=>({n:f.C.name,tier:f.tier}))};collection.unshift(rec);save();
  for(const f of inside)killFrog(f);jarFly={t:0};sfx.win();buzz([15,40,15]);toast(`收进展柜 · 第 ${collection.length} 瓶`,'',1600);hud()}
function updJarFly(dt){if(!jarFly)return;jarFly.t+=dt;const t=jarFly.t;
  if(t<.7){const k=t/.7,e=k*k;jarGroup.position.set(lerp(J.x,Xw*.85,e),lerp(0,Ytop,e)+Math.sin(k*Math.PI)*.8,0);jarGroup.scale.setScalar(1-e*.85);cork.position.set(jarGroup.position.x,jarGroup.position.y+J.H*jarGroup.scale.x+.12,0);cork.scale.setScalar(jarGroup.scale.x)}
  else if(t<1.1){jarGroup.visible=cork.visible=false}
  else{if(!jarGroup.visible){jarGroup.visible=cork.visible=true;J.sealed=false;J.lidT=0;placeCork();jarGroup.position.set(J.x,0,0)}const k=Math.min(1,(t-1.1)/.4),s=k<1?1.15*Math.sin(k*Math.PI/2)-.15*k:1;jarGroup.scale.setScalar(Math.max(.01,s));cork.scale.setScalar(Math.max(.01,s));if(k>=1){jarGroup.scale.setScalar(1);cork.scale.setScalar(1);jarFly=null}}}

/* ---------- 手机重力 ---------- */
let GX=0,GY=-15,tilt=null,motionAsked=false,lastA=null,lastShake=0,clock=0;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function askMotion(){if(motionAsked)return;motionAsked=true;try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission().catch(()=>{})}catch(e){}}
addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;let gx=-a.x,gy=-a.y;if(isIOS){gx=a.x;gy=a.y}
  const ang=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180,sx=gx*Math.cos(ang)-gy*Math.sin(ang),sy=gx*Math.sin(ang)+gy*Math.cos(ang),m=Math.hypot(sx,sy);
  tilt=m/9.8<.25?null:{x:sx/m,y:sy/m};
  if(lastA){const j=Math.hypot(a.x-lastA.x,a.y-lastA.y,(a.z||0)-(lastA.z||0));if(j>16&&clock-lastShake>.35){lastShake=clock;const k=Math.min(1,(j-16)/20);for(const f of frogs){if(f.frozen>0)continue;addVel(f,rand(-3,3)*k,rand(3,6)*k,.3);f.expr='squeeze';f.exprT=.3}sfx.squeak(.5)}}lastA={x:a.x,y:a.y,z:a.z||0}});

/* ---------- 每帧逻辑 ---------- */
function logic(dt){clock+=dt;
  GX=lerp(GX,tilt?tilt.x*15:0,.08);GY=lerp(GY,tilt?tilt.y*15:-15,.08);
  for(const f of frogs.slice()){if(!frogs.includes(f))continue;const c=centroid(f);
    const ax=((c.x-f.cx)/dt-(f.vx||0))/dt;f.ax=ax;f.ay=((c.y-f.cy)/dt-(f.vy||0))/dt;f.sv=(f.sv||0)+((clamp(-ax*.004,-.5,.5)-(f.slosh||0))*70-(f.sv||0)*3.2)*dt;f.slosh=(f.slosh||0)+f.sv*dt;
    f.vx=(c.x-f.cx)/dt;f.vy=(c.y-f.cy)/dt;f.cx=c.x;f.cy=c.y;const onG=f.ground>2;
    if(onG&&!f.wasG&&f.impact<-3){const v=clamp(-f.impact/12,.05,.35);if(f.frozen>0)tone(2600,2500,.25,.06);else{tone(300/(1+.15*(f.tier-1)),130,.25,v);tone(220,110,.2,v*.4,'triangle',.02)}if(f.exprT<=0){f.expr='squeeze';f.exprT=.2}}
    f.impact=onG?0:Math.min(f.impact||0,f.vy);f.wasG=onG;
    if(f.sq>0)f.sq=Math.max(0,f.sq-dt*2.4);if(f.exprT>0){f.exprT-=dt;if(f.exprT<=0)f.expr='idle'}
    f.blinkT-=dt;if(f.blinkT<0){f.blink=Math.max(0,f.blink-dt*14);if(f.blink<=0)f.blinkT=rand(1.8,4.5)}else f.blink=Math.min(1,f.blink+dt*10);
    if(f.frozen>0){f.frozen-=dt;updIce(f);if(f.frozen<=0)shatter(f)}
    const pl=f.r*2.2;let stretch=1;if(f.grabs.length>=2){const p1=f.pts[f.grabs[0].i],p2=f.pts[f.grabs[1].i];stretch=Math.hypot(p1.x-p2.x,p1.y-p2.y)/pl;if(stretch>2.6){if(f.frozen>0)shatter(f);burst(f,1.1);continue}}
    jarState(f,c);
    if(f.jst==='in'&&!f.inJar&&GY<-8)addVel(f,0,-24*dt,0);
    if(f.grabs.length===1&&f.frozen<=0&&Math.random()<dt*2.5){for(const p of f.pts)if(Math.random()<.3){p.px-=rand(-1,1)*1.2*H2;p.py-=rand(-.4,1)*1.2*H2}}
    if(!f.grabs.length&&onG&&f.frozen<=0&&!f.merge){f.hopT-=dt;if(f.hopT<=0){f.hopT=rand(1.6,3.8);
      if(f.jst==='in'){if(!J.sealed&&Math.random()<.35)addVel(f,rand(-.3,.3),rand(5,6.2),.35)}
      else{let dir=Math.random()<.5?-1:1;const mate=frogs.find(o=>o!==f&&o.C===f.C&&o.tier===f.tier&&o.jst!=='in');if(mate&&Math.random()<.55)dir=Math.sign(centroid(mate).x-c.x)||dir;
        if(c.x<-Xw+f.r*2)dir=1;if(c.x>Xw-f.r*2)dir=-1;if(Math.abs(c.x-J.x)<J.bw+f.r*1.8&&!(mate&&centroid(mate).jst))dir=Math.sign(c.x-J.x)||-1;
        addVel(f,dir*rand(.8,2),rand(5,7)*(1-.06*(f.tier-1))*(f.C.soft>.08?1.15:1),.35);tone(420/(1+.12*(f.tier-1)),760,.1,.07)}}}}
  checkMerges(dt);updMerges(dt);
  for(const r of reforms)r.t-=dt;for(const r of reforms.filter(r=>r.t<=0)){if(frogs.length<14){const{f}=newFrog(r.C,r.tier,r.x,Math.min(Ytop-1,2.2),.35);addVel(f,0,3,.2);tone(300,700,.1,.2)}}reforms=reforms.filter(r=>r.t>0);
  if(J.lidT>0&&J.lidT<1){J.lidT=Math.min(1,J.lidT+dt*2.2);const t=1-Math.pow(1-J.lidT,3),a=corkHome(),b=new THREE.Vector3(J.x,J.H+.12,0);cork.position.lerpVectors(a,b,t);cork.position.y+=Math.sin(t*Math.PI)*1.4;cork.rotation.z=(1-t)*3;
    if(J.lidT>=1){J.sealed=true;J.sealT=1.1;cork.position.copy(b);cork.rotation.z=0;sfx.cork();for(const f of frogs)if(f.inJar){f.expr='happy';f.exprT=1.2}}}
  if(J.sealed&&J.sealT>0&&!jarFly){J.sealT-=dt;if(J.sealT<=0)collectJar()}
  updJarFly(dt);updBombs(dt);updHammers(dt);updParts(dt);updFlashes(dt);shake=Math.max(0,shake-dt);
}

/* ---------- 输入 ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hit=new THREE.Vector3();
let tool='hand',interactions=0;
function toWorld(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);ray.ray.intersectPlane(plane,hit);return{x:hit.x,y:hit.y}}
canvas.addEventListener('pointerdown',e=>{audio();askMotion();e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  const w=toWorld(e),P={x:w.x,y:w.y,t:performance.now(),moved:0,frog:null};pointers.set(e.pointerId,P);if(++interactions===4)$('hint').classList.add('fade');
  if(tool==='bomb'){dropBomb(w.x,w.y);return}if(tool==='hammer'){hammerAt(w.x,w.y);return}
  if(tool==='freeze'){const f=frogNear(w.x,w.y,1.5);if(f)freeze(f);else{sfx.freeze();for(let i=0;i<10;i++)addPart({x:w.x,y:Math.max(.1,w.y),z:.4,vx:rand(-2,2),vy:rand(0,2.5),vz:rand(-1,1),s:rand(.025,.045),life:.5,col:new THREE.Color('#e8f8ff'),kind:'spark'})}return}
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  if(cork&&cork.visible&&J.lidT<=0&&ray.intersectObject(cork).length){if(sealAvail())seal();else{toast(frogs.some(f=>f.jst==='in')?'等蛙完全进去再封':'先把蛙塞进罐子','',1200);tone(300,200,.1,.1)}return}
  const best=frogNear(w.x,w.y,1.35);
  if(best){let bi=0,b2=1e9;best.pts.forEach((p,i)=>{const d=(p.x-w.x)**2+(p.y-w.y)**2;if(d<b2){b2=d;bi=i}});const cl=[];for(const k of [-1,0,1]){const i=(bi+k+N)%N;cl.push({i,ox:(best.rest[i].x-best.rest[bi].x)*.9,oy:(best.rest[i].y-best.rest[bi].y)*.9})}
    best.grabs.push({pid:e.pointerId,i:bi,cl});P.frog=best;tone(380,240,.09,.12);buzz(8)}},{passive:false});
canvas.addEventListener('pointermove',e=>{const P=pointers.get(e.pointerId);if(!P)return;const w=toWorld(e);P.moved+=Math.abs(w.x-P.x)+Math.abs(w.y-P.y);P.x=w.x;P.y=w.y});
function up(e){const P=pointers.get(e.pointerId);if(!P)return;pointers.delete(e.pointerId);if(P.frog){const f=P.frog;f.grabs=f.grabs.filter(g=>g.pid!==e.pointerId);
  if(performance.now()-P.t<230&&P.moved<.08&&f.frozen<=0){addVel(f,rand(-.4,.4),rand(4.5,6),.35);f.expr='happy';f.exprT=.7;tone(620,980,.08,.15)}}}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('lostpointercapture',up);
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{audio();tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  const tips={bomb:'点任意位置扔炸弹',hammer:'点青蛙敲一下，冰冻的会被敲碎',freeze:'点青蛙冻成冰块'};if(tips[tool])toast(tips[tool],'',1000)}));
$('spawn').addEventListener('click',()=>{audio();askMotion();if(frogs.length>=12){toast('桌上挤满啦，先合成或装瓶','',1300);return}
  const commons=POOL.c,lone=commons.filter(c=>frogs.filter(f=>f.C===c&&f.tier===1).length%2===1);const C=lone.length&&Math.random()<.65?pick(lone):pick(commons);
  const{f,nw}=newFrog(C,1,rand(-Xw+1,J.x-J.bw-1),Ytop-.8);addVel(f,rand(-1,1),0);tone(420,760,.12,.1);if(nw)toast(C.name,'新发现',1400)});
$('seal').addEventListener('click',()=>{audio();seal()});
function renderDex(){const B=$('dexBody');B.textContent='';for(const [tier,lab,col] of [[undefined,'普通','#9a8a92'],['稀有','稀有','#4fb6ff'],['传说','传说','#b98cff']]){const h=document.createElement('div');h.className='tier';h.style.color=col;h.textContent=lab;B.appendChild(h);
  const g=document.createElement('div');g.className='grid';COLORS.filter(c=>c.rare===tier).forEach(C=>{const d=document.createElement('div');const ok=!!seen[C.name];d.className='dx'+(ok?'':' lock');const ball=document.createElement('div');ball.className='ball';if(ok)ball.style.background=swatch(C);const b=document.createElement('b');b.textContent=ok?C.name:'？？？';d.append(ball,b);g.appendChild(d)});B.appendChild(g)}}
function renderCab(){const B=$('cabBody');B.textContent='';if(!collection.length){const e=document.createElement('div');e.className='empty';e.textContent='还没有收藏。把蛙塞进玻璃罐，点「封瓶收藏」。';B.appendChild(e);return}
  const g=document.createElement('div');g.className='jars';collection.forEach((r,i)=>{const d=document.createElement('div');d.className='jar';const b=document.createElement('b');b.textContent=`No.${String(collection.length-i).padStart(3,'0')}`;
    const dots=document.createElement('div');dots.className='dots';for(const fr of r.frogs){const C=COLORS.find(c=>c.name===fr.n);const k=document.createElement('i');if(C)k.style.background=swatch(C);k.title=fr.n+' · '+TIER_N[fr.tier-1];const sz=12+fr.tier*3;k.style.width=sz+'px';k.style.height=sz*.86+'px';dots.appendChild(k)}
    const names=document.createElement('small');names.textContent=r.frogs.map(f=>f.n).join('、');const dt=document.createElement('small');const D=new Date(r.t);dt.textContent=`${D.getMonth()+1}/${D.getDate()} ${String(D.getHours()).padStart(2,'0')}:${String(D.getMinutes()).padStart(2,'0')}`;
    d.append(b,dots,names,dt);g.appendChild(d)});B.appendChild(g)}
$('openDex').addEventListener('click',()=>{renderDex();$('dexSheet').hidden=false});$('openCab').addEventListener('click',()=>{renderCab();$('cabSheet').hidden=false});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{b.closest('.sheet').hidden=true}));
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('pointerdown',e=>{if(e.target===s)s.hidden=true}));

/* ---------- 启动 ---------- */
buildJar();
function fit(){resize();DPR=Math.min(2,devicePixelRatio||1);fxc.width=innerWidth*DPR|0;fxc.height=innerHeight*DPR|0}
fit();addEventListener('resize',fit);
for(const [i,C] of [POOL.c[0],POOL.c[0],POOL.c[1],POOL.c[1],POOL.c[2],POOL.c[2]].entries())newFrog(C,1,lerp(-Xw+1.2,J.x-J.bw-1.2,i/5),1+(i%2)*1.2);
hud();setTimeout(()=>$('hint').classList.add('fade'),12000);
let last=performance.now(),acc=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;
  try{let n=0;while(acc>=1/60&&n<3){physics();logic(1/60);acc-=1/60;n++}if(n===3)acc=0;for(const f of frogs)syncFrog(f);
    camera.position.copy(camBase);if(shake>0){camera.position.x+=rand(-1,1)*shake*.18;camera.position.y+=rand(-1,1)*shake*.18}
    const sb=$('seal');if(sealAvail()){const s=toScreen(J.x,J.H+.35);sb.hidden=false;sb.style.left=s.x+'px';sb.style.top=s.y+'px'}else sb.hidden=true;
    composer.render();drawSplats(dt)}catch(err){console.error(err)}}
requestAnimationFrame(frame);
window.__g={camBase,camera,frogs:()=>frogs,J,centroid,newFrog,COLORS,explode,freeze,hammerAt,burst,seal,setTool:t=>{tool=t}};
</script>
