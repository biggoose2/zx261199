<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>果冻蛙瓶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
/* 横屏 3D 游戏：全屏 WebGL 舞台；UI 为暖白毛玻璃浮层（左上品牌、右上数据、底部工具坞、右侧罐子操作），单一暖光主题 */
:root{
  --bg:#eadccd;--ink:#4a3c45;--ink-soft:rgba(74,60,69,.58);--glass:rgba(255,252,248,.62);--line:rgba(255,255,255,.9);
  --accent:#ff7d93;--accent-2:#ffb36b;--mint:#4fcf9f;--shadow:0 10px 30px rgba(110,70,60,.16);
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--latin:"Fredoka","Noto Sans SC",sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl,#fxc{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fxc{pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 9px;border-radius:999px}
.logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ffc2cf 30%,#ff7d93 75%);box-shadow:inset 0 -3px 6px rgba(200,40,80,.25),0 3px 8px rgba(255,125,147,.4);position:relative}
.logo::before,.logo::after{content:"";position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2a1b28 0 32%,#fff 36% 48%,#ff9fb2 52%);}
.logo::before{left:3px}.logo::after{right:3px}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.1em;line-height:1.1}
.brand i{display:block;font-style:normal;font-family:var(--latin);font-size:10px;letter-spacing:.3em;color:var(--ink-soft)}
.stats{display:flex;gap:8px;pointer-events:auto}
.stat{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 8px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);font-family:var(--font);color:var(--ink)}
.stat span{font-family:var(--latin);font-size:15px;font-variant-numeric:tabular-nums}
.stat em{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.stat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dock-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:14px;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.spawn{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;color:#fff;font:900 13px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 35% 28%,#ffd4dc 0 10%,#ff98aa 35%,#ff6f88 80%);box-shadow:0 10px 24px rgba(255,111,136,.45),inset 0 -6px 12px rgba(190,40,80,.3),inset 0 4px 8px rgba(255,255,255,.5);transition:transform .12s}
.spawn svg{width:26px;height:26px}
.spawn:active{transform:scale(.92)}
.dock{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:26px}
.tool{width:64px;height:58px;border:0;border-radius:20px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px var(--font);cursor:pointer;transition:background .15s,transform .12s,color .15s}
.tool svg{width:26px;height:26px}
.tool:active{transform:scale(.92)}
.tool[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 4px 12px rgba(110,70,60,.15)}
.tool:focus-visible,.spawn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);padding:11px 22px;border-radius:999px;font-weight:900;font-size:16px;pointer-events:none;white-space:nowrap;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.toast small{font-weight:700;font-size:12px;margin-right:8px;padding:2px 8px;border-radius:999px;color:#fff;vertical-align:2px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);padding:8px 16px;border-radius:14px;font-size:12.5px;line-height:1.7;text-align:center;pointer-events:none;transition:opacity 1s;max-width:calc(100% - 40px);width:max-content}
.hint.fade{opacity:0}
.rot{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:12px;pointer-events:none;display:none}
@media (orientation:portrait){.rot{display:block}.tool{width:44px}.spawn{width:64px;height:64px}.dock-wrap{gap:8px}.jarbtn{font-size:0;gap:0;padding:0 12px}.meter{min-width:90px}}
.sheet{position:fixed;inset:0;background:rgba(60,40,50,.28);display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:#fffaf6;border-radius:26px;box-shadow:0 24px 60px rgba(60,30,40,.25);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop2 .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop2{from{transform:scale(.85);opacity:0}}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.card-h h2{margin:0;font-size:19px;font-weight:900;letter-spacing:.08em}
.card-h p{margin:2px 0 0;font-size:12px;color:var(--ink-soft)}
.x{border:0;background:#f2e8e2;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.card-b{overflow-y:auto;padding:4px 20px 20px;touch-action:pan-y}
.tier{margin:12px 0 8px;font-size:12px;font-weight:900;letter-spacing:.15em;display:flex;align-items:center;gap:8px}
.tier::after{content:"";flex:1;height:1px;background:rgba(74,60,69,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.dx{border-radius:18px;background:#fff;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(74,60,69,.06);border:1px solid rgba(74,60,69,.06)}
.dx .ball{width:46px;height:40px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;position:relative;box-shadow:inset 0 -6px 10px rgba(0,0,0,.12),inset 0 5px 8px rgba(255,255,255,.6)}
.dx .ball::before{content:"";position:absolute;left:8px;top:6px;width:12px;height:7px;border-radius:50%;background:rgba(255,255,255,.75)}
.dx b{font-size:12.5px}
.dx.lock{opacity:.55}.dx.lock .ball{background:#e7ded8!important;box-shadow:inset 0 -4px 8px rgba(0,0,0,.08)}
.dx.lock b{color:var(--ink-soft)}
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.jar{border-radius:20px;background:linear-gradient(180deg,#fff,#f6fbf9);border:1px solid rgba(120,180,160,.25);padding:12px;display:flex;flex-direction:column;gap:8px}
.jar .dots{display:flex;flex-wrap:wrap;gap:5px}
.jar .dots i{width:18px;height:16px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;display:inline-block;box-shadow:inset 0 -3px 5px rgba(0,0,0,.12)}
.jar small{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.jar b{font-size:13px}
.empty{padding:30px 0;text-align:center;color:var(--ink-soft);font-size:13px}
/* 底部：左工具坞 · 中间来只蛙 · 右装瓶；装瓶模式时换成装瓶条 */
.spawn small{font:600 10px var(--latin);opacity:.85;font-variant-numeric:tabular-nums}
.jarbtn{pointer-events:auto;height:58px;padding:0 16px 0 12px;border-radius:22px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font:900 13px var(--font);color:#2a8f6a;cursor:pointer}
.jarbtn svg{width:28px;height:28px}
.jarbar{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:26px}
.meter{display:flex;flex-direction:column;gap:5px;min-width:130px;font-size:12px;font-weight:700}
.meter i{display:block;height:8px;border-radius:99px;background:rgba(74,60,69,.1);overflow:hidden}
.meter i b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7fe3c0,#4fcf9f);transition:width .25s}
.meter.full i b{background:linear-gradient(90deg,#ffb36b,#ff7d93)}
.bbtn{height:46px;padding:0 18px;border-radius:18px;border:0;font:900 14px var(--font);cursor:pointer}
.bbtn.ghost{background:#f2e8e2;color:var(--ink)}
.bbtn.go{color:#fff;background:linear-gradient(180deg,#d9a46a,#b98149);box-shadow:0 6px 14px rgba(140,90,40,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.bbtn.go:disabled{background:#d8ccc4;box-shadow:none;cursor:default}
/* 果冻回弹 */
.jelly{animation:jelly .45s}
@keyframes jelly{20%{transform:scale(1.18,.84)}45%{transform:scale(.9,1.1)}70%{transform:scale(1.05,.96)}}
.stat.bump{animation:jelly .5s}
/* 拖出工具时的幽灵图标 */
.ghost-tool{position:fixed;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;display:grid;place-items:center;color:var(--accent);pointer-events:none;z-index:20;transform:scale(1.1)}
.ghost-tool svg,.ghost-tool img{width:34px;height:34px;object-fit:contain}
/* 蛙头顶飘字 */
.float{position:fixed;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;font-weight:900;font-size:15px;color:var(--ink);text-shadow:0 1px 0 #fff,0 0 8px rgba(255,255,255,.9);animation:floatUp 1.5s ease-out forwards;z-index:5}
.float small{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;color:#fff;margin-right:6px;vertical-align:2px;text-shadow:none}
.float.combo{font-family:var(--latin);font-size:22px;color:#ff7d93}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}15%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}25%{transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-260%)}}
/* 图鉴：每种颜色下 4 个体型格，集齐金框 */
.dx .shapes{display:flex;gap:4px}
.dx .shapes i{width:12px;height:10px;background:#e7ded8;display:inline-block}
.dx .shapes i.on{background:var(--c)}
.dx.gold{border:2px solid #f2c45a;box-shadow:0 0 0 3px rgba(242,196,90,.25),0 4px 12px rgba(242,196,90,.35)}
:is(.dots,.shapes,.legend-row) i.s-normal{border-radius:50% 50% 46% 46%/60% 60% 40% 40%}
:is(.dots,.shapes,.legend-row) i.s-round{border-radius:50%}
:is(.dots,.shapes,.legend-row) i.s-fat{border-radius:50% 50% 44% 44%/55% 55% 45% 45%;transform:scaleX(1.25)}
:is(.dots,.shapes,.legend-row) i.s-floppy{border-radius:60% 60% 30% 30%/80% 80% 20% 20%;transform:scale(1.25,.7)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin:6px 0 2px}
.legend-row span{display:flex;align-items:center;gap:5px}
.legend-row i{width:14px;height:12px;background:#ff98aa;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,62vw)}
.editbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);transform:translateX(-50%);width:min(880px,calc(100% - 32px));background:#fdf3e4;border:3px solid #e2ab50;box-shadow:inset 0 0 0 2px #f8dc9c,0 12px 30px rgba(120,70,40,.25);border-radius:22px;padding:6px 8px 7px;display:flex;flex-direction:column;gap:4px}
.ed-top{display:flex;align-items:center;gap:10px}.ed-tip{font-size:11.5px;color:#a07a58;margin-left:auto}
.tabs{display:flex;gap:4px;background:#f6e3c8;border-radius:999px;padding:3px}
.tab{border:0;background:transparent;border-radius:999px;padding:5px 13px;font:900 13px var(--font);color:#9a7050;cursor:pointer}
.tab[aria-pressed="true"]{background:#fff;color:#e5577a;box-shadow:0 2px 6px rgba(150,90,40,.18)}
.editbar .bbtn{height:34px}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;touch-action:pan-x;scrollbar-width:thin}
.ecard{flex:0 0 auto;width:70px;border:2px solid #f0d6b0;background:#fffaf2;border-radius:16px;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-family:var(--font);color:#7a4a2a}
.ecard img{width:50px;height:50px;object-fit:contain;border-radius:12px;background:radial-gradient(circle at 50% 40%,#ffe3ea,#ffd3dd 70%)}.ecard b{font-size:11.5px}.ecard small{font:600 10px var(--latin);color:#b08a68}
.ecard:disabled{opacity:.45;cursor:default}.ecard:not(:disabled):active{transform:scale(.94)}
.sel{position:fixed;border:2px dashed #fff;border-radius:14px;box-shadow:0 0 0 2px rgba(79,207,159,.8),0 0 18px rgba(79,207,159,.45);pointer-events:none;z-index:4}
.sel.bad{box-shadow:0 0 0 2px rgba(255,80,100,.9),0 0 18px rgba(255,80,100,.5);background:rgba(255,80,100,.12)}
.selbar{position:absolute;left:50%;top:-44px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.selbar button{border:0;border-radius:999px;padding:7px 12px;font:900 12px var(--font);background:#fff;color:#7a4a2a;box-shadow:0 4px 10px rgba(120,70,40,.25);cursor:pointer;white-space:nowrap}
.selbar button#selDel{color:#e5577a}
.editing .top,.editing .hint{display:none}
.chip{border:1px solid rgba(74,60,69,.12);background:#fff;border-radius:999px;padding:6px 11px;font:700 12px var(--font);color:var(--ink-soft);cursor:pointer}
.chip[aria-pressed="true"]{background:#ffe3ea;border-color:#ffb3c3;color:var(--ink)}
.res-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(74,60,69,.08);font-weight:700}
.res-row i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15)}
.res-row span{margin-left:auto;font-family:var(--latin);font-size:18px;font-variant-numeric:tabular-nums}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:14px}
@media (prefers-reduced-motion:reduce){.toast,.card,.jelly,.float{animation:none}}
/* ===== 素材皮肤：棕金胶囊 + 奶油底座 + 蝴蝶结（覆盖上面的玻璃风格） ===== */

const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const canvas=$('gl');let renderer;

const P=new Uint8Array(512);{const a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)P[i]=a[i&255]}
const GR=new Float32Array(256).map(()=>Math.random()*2-1);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),u=x-xi,v=y-yi,su=u*u*(3-2*u),sv=v*v*(3-2*v),X=xi&255,Y=yi&255;const a=GR[P[P[X]+Y]],b=GR[P[P[X+1]+Y]],c=GR[P[P[X]+Y+1]],d=GR[P[P[X+1]+Y+1]];return a+(b-a)*su+(c-a)*sv+(a-b-c+d)*su*sv}
function fbm(x,y,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2.03;a*=.5}return s}
function pixTex(w,h,fn,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),img=x.createImageData(w,h),d=img.data;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const o=(j*w+i)*4,[r,g,b]=fn(i,j);d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255}x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
function canTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const woodTex=pixTex(1024,512,(i,j)=>{const ring=j*.09+fbm(i*.003,j*.04,4)*4;const q=.5+.5*Math.sin(ring*6.283),m=q*q*q;const f=fbm(i*.03,j*.6,2)*7+fbm(i*.002,j*.01,2)*10;

function renderCab(){const B=$('cabBody');B.textContent='';if(!collection.length){const e=document.createElement('div');e.className='empty';e.textContent='还没有收藏。点右下角「装瓶」，把蛙放进瓶子再封瓶。';B.appendChild(e);return}
  const g=document.createElement('div');g.className='jars';collection.forEach((r,i)=>{const d=document.createElement('div');d.className='jar';const b=document.createElement('b');b.textContent=`No.${String(collection.length-i).padStart(3,'0')}`+(r.name?` · ${r.name}`:'');
    const dots=document.createElement('div');dots.className='dots';for(const fr of r.frogs){const C=COLORS.find(c=>c.name===fr.n);const k=document.createElement('i');k.className='s-'+(fr.s||'normal');if(C)k.style.background=swatch(C);k.title=fr.n+' · '+shapeLabel(fr.s||'normal',fr.tier);const sz=12+fr.tier*3;k.style.width=sz+'px';k.style.height=sz*.86+'px';dots.appendChild(k)}
    const names=document.createElement('small');names.textContent=r.frogs.map(f=>f.n).join('、');const dt=document.createElement('small');const D=new Date(r.t);dt.textContent=`${D.getMonth()+1}/${D.getDate()} ${String(D.getHours()).padStart(2,'0')}:${String(D.getMinutes()).padStart(2,'0')}`;
    d.append(b,dots,names,dt);g.appendChild(d)});B.appendChild(g)}
$('openDex').addEventListener('click',()=>{renderDex();$('dexSheet').hidden=false});$('openCab').addEventListener('click',()=>{renderCab();$('cabSheet').hidden=false});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{b.closest('.sheet').hidden=true}));

buildJar();
let PR=Math.min(2,window.devicePixelRatio||1);
function fit(){renderer.setPixelRatio(PR);composer.setPixelRatio(PR);resize();DPR=Math.min(2,devicePixelRatio||1);fxc.width=innerWidth*DPR|0;fxc.height=innerHeight*DPR|0}
fit();addEventListener('resize',fit);buildShell();fixLayout();layoutRoom();initItems();applyNight(true);
for(const [i,C] of [POOL.c[0],POOL.c[0],POOL.c[1],POOL.c[1],POOL.c[2],POOL.c[2]].entries())newFrog(C,1,lerp(-Xw+1.2,Xw-1.2,i/5),1+(i%2)*1.2);
hud();setTimeout(()=>$('hint').classList.add('fade'),14000);
let last=performance.now(),acc=0,errShown=false,perfT=0,perfN=0;
function frame(t){requestAnimationFrame(frame);const raw=(t-last)/1000,dt=Math.min(.05,raw);last=t;acc+=dt;
  // 自适应清晰度：持续掉帧就降低像素比
  perfT+=raw;perfN++;if(perfT>2){const fps=perfN/perfT;perfT=0;perfN=0;if(fps<45&&PR>1&&!document.hidden){PR=Math.max(1,PR-.25);fit()}}
  try{let n=0;while(acc>=1/60&&n<3){physics();logic(1/60);acc-=1/60;n++}if(n===3)acc=0;for(const f of frogs)syncFrog(f);
    applyNight(clock-nightT>.5&&(nightT=clock,true));const tt=performance.now()/1000;for(const m of gemMats)m.uniforms.uTime.value=tt;
    edCam+=((decor?1:0)-edCam)*.12;const E=camE||camN,cd=lerp(camN.dist,E.dist,edCam),cl=lerp(camN.look,E.look,edCam);camera.position.set(0,cl+cd*.1,cd);camera.lookAt(0,cl,0);if(shake>0){camera.position.x+=rand(-1,1)*shake*.18;camera.position.y+=rand(-1,1)*shake*.18}
    if(sel)updSel();composer.render();drawSplats(dt)}catch(err){if(!errShown){errShown=true;console.error(err)}}}
requestAnimationFrame(frame);
